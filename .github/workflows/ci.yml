name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Run tests
        run: uv run --frozen pytest -q

  quality:
    name: Quality and package validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Type check
        run: uv run --frozen mypy src/atlas_cli
      - name: Install Skill validation dependencies
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Validate Skill
        run: |
          uv run --frozen python scripts/quick_validate_skill.py skills/atlas-flight-booking
          bash tests/skill/validate-skill.sh skills/atlas-flight-booking
      - name: Scan for secrets
        run: uv run --frozen python -m scripts.scan_secrets .
      - name: Build distributions
        run: uv build
